<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDeskHQ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>HelpDeskHQ</h1>
    <p class="tagline">IT help desk ticket tracker</p>
  </header>

  <main>
    <section class="panel">
      <h2>Submit a ticket</h2>
      <form id="ticket-form">
        <label>
          Title
          <input name="title" maxlength="120" required placeholder="e.g. Cannot connect to Wi-Fi" />
        </label>
        <label>
          Description
          <textarea name="description" rows="3" placeholder="What's going on?"></textarea>
        </label>
        <div class="row">
          <label>
            Requester
            <input name="requester" placeholder="username" />
          </label>
          <label>
            Priority
            <select name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <button type="submit">Create ticket</button>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="panel">
      <div class="list-header">
        <h2>Tickets</h2>
        <select id="status-filter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="open">Open</option>
          <option value="in-progress">In progress</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <p id="counts" class="muted"></p>
      <ul id="ticket-list"></ul>
      <p id="empty" class="muted" hidden>No tickets here.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
